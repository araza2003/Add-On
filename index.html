<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add-On | GitHub Push</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Add-On</h1>
        <p class="subtitle">Push folders or ZIPs directly to GitHub</p>

        <div id="login-section">
            <button id="login-btn" class="btn primary">Sign in with GitHub</button>
        </div>

        <div id="app-section" class="hidden">
            <div class="user-info">
                <img id="avatar" src="" alt="Avatar">
                <span id="username"></span>
                <button id="logout-btn" class="btn text">Logout</button>
            </div>

            <div class="form-group">
                <label>Repository (e.g., araza2003/Add-On)</label>
                <input type="text" id="repo-input" placeholder="owner/repo">
            </div>

            <div class="form-group">
                <label>Branch</label>
                <input type="text" id="branch-input" value="main">
            </div>

            <div class="form-group">
                <label>Upload Files (Folder or ZIP)</label>
                <input type="file" id="file-input" webkitdirectory directory multiple>
                <p class="help-text">Select a folder or a ZIP file to push.</p>
            </div>

            <button id="push-btn" class="btn primary">Push to GitHub</button>
            
            <div id="progress-container" class="hidden">
                <div class="progress-bar"><div id="progress-fill"></div></div>
                <p id="progress-text">0%</p>
            </div>
            <div id="status-log"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
